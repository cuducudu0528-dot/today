<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>연서의 하루</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="연서의 하루">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__chartReady&&window.__chartReady()"></script>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f6; --ink:#111114; --sub:#8a8a93; --line:rgba(60,60,67,.12);
  --accent:#ff7a45;
  --blue:#2f7cf6; --blue-bg:#e8f1ff;
  --orange:#f2803a; --orange-bg:#fff0e4;
  --green:#22a35a; --green-bg:#e4f7ec;
  --purple:#7a5af5; --purple-bg:#efeaff;
  --pink:#e5487e; --pink-bg:#ffe9f1;
  --red:#ef4444; --red-bg:#ffeaea;
  --yellow:#b07800; --yellow-bg:#fff5d6;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --r:24px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1f; --card2:#2a2a2e; --ink:#f5f5f7; --sub:#9a9aa3; --line:rgba(255,255,255,.1);
    --blue-bg:#14243d; --orange-bg:#35230f; --green-bg:#11291b; --purple-bg:#231d3d; --pink-bg:#361a25; --red-bg:#3a1717; --yellow-bg:#332a0c;
    --blue:#6ea8ff; --orange:#ffa266; --green:#5fd68f; --purple:#a891ff; --pink:#ff86b0; --red:#ff7b7b; --yellow:#ffd25e;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.015em;
  padding:calc(env(safe-area-inset-top) + 6px) 0 calc(96px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:680px;margin:0 auto;padding:10px 18px 0}
button{font:inherit;color:inherit}
.btn{appearance:none;border:0;cursor:pointer;transition:transform .12s ease, opacity .12s}
.btn:active{transform:scale(.94);opacity:.85}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 4px}
.eyebrow{font-size:13px;font-weight:650;color:var(--sub);letter-spacing:0}
.title{white-space:pre-line;font-size:30px;font-weight:800;letter-spacing:-.035em;margin:2px 0 0;line-height:1.18;word-break:keep-all}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#ffb347,#ff6f61)}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin:8px 3px 0;min-height:16px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--red)}.dot.wait{background:#e0b100}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.iconbtn svg{width:19px;height:19px}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 10px}
.sec h3{margin:0;font-size:19px;font-weight:750;letter-spacing:-.025em}
.sec a{font-size:14px;font-weight:650;color:var(--accent);text-decoration:none}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.sub{color:var(--sub);font-size:14px;line-height:1.5}

.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 18px;color:#fff;cursor:pointer;
  background:linear-gradient(140deg,#ff9a56 0%,#ff6f61 55%,#d9468f 100%);box-shadow:0 12px 30px rgba(255,111,97,.28)}
.hero.eve{background:linear-gradient(140deg,#5b6cf0 0%,#7b4fd8 55%,#3a2a8c 100%);box-shadow:0 12px 30px rgba(91,108,240,.3)}
.hero.week{background:linear-gradient(140deg,#1fb37a 0%,#128a8f 100%);box-shadow:0 12px 30px rgba(18,138,143,.25)}
.hero.none{background:linear-gradient(140deg,#a0a8ba,#6f7789);box-shadow:none}
.hero::before{content:'';position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::after{content:'';position:absolute;right:40px;bottom:-80px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .k{position:relative;z-index:1;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:750;background:rgba(255,255,255,.22);padding:6px 11px;border-radius:999px}
.hero h2{font-size:25px;line-height:1.3;font-weight:800;letter-spacing:-.03em;margin:14px 0 6px;position:relative;z-index:1;word-break:keep-all}
.hero p{margin:0;font-size:14.5px;line-height:1.5;opacity:.93;position:relative;z-index:1;word-break:keep-all}
.hero .more{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px;font-weight:700;position:relative;z-index:1}
.hero .pill{background:#fff;color:#e2584e;border-radius:999px;padding:8px 13px}
.hero.eve .pill{color:#5b4fd8}.hero.week .pill{color:#128a8f}.hero.none .pill{color:#6f7789}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:12px;position:relative;z-index:1}
.alerts span{font-size:13px;font-weight:700;background:rgba(0,0,0,.18);padding:8px 11px;border-radius:12px;line-height:1.4}

.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ring{background:var(--card);border-radius:22px;padding:14px 4px 12px;text-align:center;box-shadow:var(--shadow);cursor:pointer}
.ring .rw{position:relative;width:60px;height:60px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.ring .l{font-size:12.5px;font-weight:750;margin-top:8px}
.ring .s{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}

.tl .it{display:flex;gap:12px;padding:9px 0}
.tl .t{width:50px;flex:none;font-size:13px;font-weight:750;color:var(--sub);padding-top:1px;text-align:right}
.tl .b{flex:1;font-size:15px;line-height:1.45;border-left:2px solid var(--line);padding-left:14px;position:relative}
.tl .b::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--card)}

.group{font-size:13px;font-weight:750;color:var(--sub);margin:22px 6px 8px}
.rows{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer;position:relative}
.row+.row::before{content:'';position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
.row:active{background:var(--card2)}
.ic{width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.row .m{flex:1;min-width:0}
.row .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);font-weight:650}
.row .tt{font-size:15.5px;font-weight:750;margin-top:2px;line-height:1.35;word-break:keep-all}
.row .ss{font-size:13.5px;color:var(--sub);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unread .tt::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.k-아침{background:var(--orange-bg)}.k-저녁{background:var(--purple-bg)}.k-주간,.k-월간{background:var(--green-bg)}
.k-마감{background:var(--red-bg)}.k-알림{background:var(--blue-bg)}.k-질문{background:var(--yellow-bg)}.k-일본어{background:var(--pink-bg)}.k-출발{background:var(--blue-bg)}.k-기타{background:var(--card2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:700;color:var(--sub);border:0;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card)}
.empty{text-align:center;padding:34px 18px;color:var(--sub);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.tile{border-radius:20px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile .lbl{font-size:12px;font-weight:750;opacity:.9}
.tile .val{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.2;word-break:keep-all}
.tile .note{font-size:12px;opacity:.85;line-height:1.35}
.c0{background:var(--yellow-bg);color:var(--yellow)}.c1{background:var(--purple-bg);color:var(--purple)}.c2{background:var(--pink-bg);color:var(--pink)}
.c3{background:var(--blue-bg);color:var(--blue)}.c4{background:var(--green-bg);color:var(--green)}.c5{background:var(--orange-bg);color:var(--orange)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;background:var(--bg);border-radius:26px 26px 0 0;z-index:61;
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility .32s;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--sub);opacity:.35;margin:8px auto 2px;flex:none}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 4px;flex:none}
.sheet .hd b{font-size:16px}
.sheet .x{width:30px;height:30px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
.sheet .bd{overflow-y:auto;padding:6px 18px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.bh{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.32;margin:8px 0 6px;word-break:keep-all}
.lbl2{font-size:13px;font-weight:750;color:var(--sub);margin:22px 4px 8px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.list li:first-child{border-top:0;padding-top:2px}.list li:last-child{padding-bottom:2px}
.num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:2px}
.q{background:var(--yellow-bg);border-radius:20px;padding:14px 16px}
.q b{display:block;font-size:13px;margin-bottom:6px;color:var(--yellow)}
.q div{font-size:14.5px;line-height:1.6}
.news div{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.news div:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--card2);margin-right:6px;color:var(--sub)}
.src{color:var(--sub);font-size:12px;line-height:1.5}
.quote{font-size:15px;line-height:1.6;color:var(--sub);margin:20px 4px 0;text-align:center}
.alert{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--red);background:var(--red-bg);padding:9px 12px;border-radius:14px;line-height:1.45}

.counter{display:flex;align-items:center;gap:12px}
.counter .meta{flex:1;min-width:0}
.counter .meta b{font-size:17px;display:block}
.counter .meta span{font-size:13px;color:var(--sub)}
.big{width:56px;height:56px;border-radius:18px;font-size:26px;font-weight:600}
.small{width:40px;height:40px;border-radius:14px;font-size:20px;background:var(--card2);color:var(--sub)}
.b-blue{background:var(--blue-bg);color:var(--blue)}.b-orange{background:var(--orange-bg);color:var(--orange)}
.cups{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.cups i{width:24px;height:30px;border-radius:4px 4px 9px 9px;background:var(--card2);display:block;transition:background .2s}
.cups i.on{background:linear-gradient(180deg,#9ccaff,#2f7cf6)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:12px 0 10px;border-radius:16px;background:var(--card2);color:var(--sub);font-size:22px;line-height:1.2;border:0}
.seg button small{display:block;font-size:11px;font-weight:750;margin-top:4px}
.seg button.on{background:var(--ink);color:var(--card)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:10px 15px;border-radius:999px;background:var(--card2);color:var(--sub);font-size:14px;font-weight:700;border:0}
.pills button.on{background:var(--ink);color:var(--card)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.trow+.trow{margin-top:14px}
.lab{font-size:15px;font-weight:700}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;border:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:#34c759}.toggle.on::after{left:22px}
.field{width:100%;border:0;background:var(--card2);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;outline:none}
.field::placeholder{color:var(--sub)}
.fields{display:grid;gap:8px}
.saved{font-size:12px;color:var(--sub);text-align:right;margin-top:10px;min-height:16px}

.chartbox{position:relative;height:210px}
.daylist .day{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.daylist .day:first-child{border-top:0;padding-top:0}
.daylist .d{min-width:74px;font-weight:750}
.dots{color:var(--sub);font-size:13px;line-height:1.5}

.tabbar{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:500px;margin:0 auto;
  padding:6px;border-radius:28px;display:flex;z-index:40;
  background:color-mix(in srgb, var(--card) 80%, transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  box-shadow:0 10px 30px rgba(0,0,0,.14);border:1px solid var(--line)}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:10.5px;font-weight:750;padding:7px 0 6px;border-radius:22px;position:relative}
.tabbar a svg{display:block;margin:0 auto 3px;width:23px;height:23px}
.tabbar a.on{color:var(--accent);background:color-mix(in srgb, var(--accent) 13%, transparent)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#ptr{position:fixed;left:0;right:0;top:0;text-align:center;font-size:12px;font-weight:650;color:var(--sub);padding-top:calc(env(safe-area-inset-top) + 8px);transform:translateY(-70px);transition:transform .2s;z-index:30;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:750;z-index:80;transition:transform .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
.setrow:first-child{border-top:0;padding-top:0}.setrow:last-child{padding-bottom:0}
.setrow span:last-child{color:var(--sub);font-size:14px;text-align:right}
.primary{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;border:0;margin-top:12px}
.msg{font-size:13px;color:var(--red);margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">

  <section class="view" id="v-today">
    <div class="top">
      <div><div class="eyebrow" id="dateLine"></div><div class="title" id="greet">안녕하세요</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn iconbtn" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="btn avatar" id="openSettings" aria-label="설정">연</button>
      </div>
    </div>
    <div class="status"><span class="dot wait" id="sDot"></span><span id="status">불러오는 중…</span></div>
    <div style="margin-top:16px" id="hero"></div>
    <div class="sec"><h3>오늘 기록</h3><a href="#log">기록하기</a></div>
    <div class="rings" id="rings"></div>
    <div id="todayNotices"></div>
    <div id="todaySchedule"></div>
    <div class="sec"><h3>이번 주</h3><a href="#stats">통계 보기</a></div>
    <div class="grid2" id="weekTilesMini"></div>
  </section>

  <section class="view" id="v-inbox">
    <div class="top"><div><div class="eyebrow">브리핑 · 알림 · 질문</div><div class="title">받은 알림</div></div></div>
    <div class="chips" id="filters" style="margin-top:14px"></div>
    <div id="inbox"></div>
  </section>

  <section class="view" id="v-log">
    <div class="top"><div><div class="eyebrow" id="logDate"></div><div class="title">오늘 기록</div></div></div>
    <div class="sub" style="margin:6px 4px 0">누르면 바로 저장돼요. 브리핑이 이 기록을 읽어 가요.</div>
    <div class="sec"><h3>물 · 커피</h3></div>
    <div class="stack">
      <div class="card">
        <div class="counter">
          <div class="meta"><b>💧 물 <span id="wN" style="color:var(--blue)">0</span>잔</b><span id="waterNote">목표 8잔</span></div>
          <button class="btn small" data-act="water-" aria-label="물 빼기">−</button>
          <button class="btn big b-blue" data-act="water+" aria-label="물 더하기">＋</button>
        </div>
        <div class="cups" id="cups"></div>
      </div>
      <div class="card">
        <div class="counter">
          <div class="meta"><b>☕ 커피 <span id="cN" style="color:var(--orange)">0</span>잔</b><span id="coffeeNote">14시 전 1잔</span></div>
          <button class="btn small" data-act="coffee-" aria-label="커피 빼기">−</button>
          <button class="btn big b-orange" data-act="coffee+" aria-label="커피 더하기">＋</button>
        </div>
      </div>
    </div>
    <div class="sec"><h3>컨디션</h3></div>
    <div class="card"><div class="seg" id="condSeg"></div></div>
    <div class="sec"><h3>기분</h3></div>

<script>
(function(){
"use strict";
const APP_VER="2026-11-18-3";
const DEF_URL="https://script.google.com/macros/s/AKfycbxgoPMdod-SPlKH4gcsmEH5bg1GVYMmRDgropKc4qbqLEBAKAQlR95xIzrz75Zfh2o9dg/exec";
const WEEK=["일","월","화","수","목","금","토"];
const COND=[[1,"😫","지침"],[2,"😮‍💨","피곤"],[3,"🙂","보통"],[4,"😊","좋음"],[5,"🤩","최고"]];
const WORK=["등","팔","어깨","가슴","하체","유산소","스트레칭"];
const MOOD=["평온","좋음","피곤","스트레스","우울","예민"];
const KIND_ICON={"아침":"☀️","저녁":"🌙","주간":"🗓️","월간":"📆","마감":"⏰","알림":"🔔","질문":"📝","일본어":"🇯🇵","출발":"🚶","기타":"💬"};
const BRIEF_KINDS=["아침","저녁","주간","월간","마감"];

const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function parseYmd(s){const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);}
function korDate(s){const d=parseYmd(s);return(d.getMonth()+1)+"월 "+d.getDate()+"일 "+WEEK[d.getDay()]+"요일";}
function shortDate(s){const d=parseYmd(s);return(d.getMonth()+1)+"/"+d.getDate()+" ("+WEEK[d.getDay()]+")";}
const str=v=>typeof v==="string"?v:(v==null?"":String(v));
const arr=v=>Array.isArray(v)?v:[];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null;};
function hhmm(x){const t=x instanceof Date?x:new Date(x);return isNaN(t)?"":pad(t.getHours())+":"+pad(t.getMinutes());}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
const byTime=(a,b)=>(str(b.createdAt)).localeCompare(str(a.createdAt));

let TODAY=ymd(new Date());
let days={},briefs=[],filter="전체";
let today=blankDay(TODAY);
function blankDay(id){return{date:id,water:0,coffee:0,workout:[],condition:null,mood:"",supplement:false,alcohol:false,breakfast:"",lunch:"",dinner:"",memo:"",reflected:false};}
function normDay(id,d){d=d||{};return{date:id,water:num(d.water)||0,coffee:num(d.coffee)||0,workout:arr(d.workout).map(str).filter(w=>WORK.includes(w)),
  condition:num(d.condition),mood:str(d.mood),supplement:!!d.supplement,alcohol:!!d.alcohol,breakfast:str(d.breakfast),lunch:str(d.lunch),dinner:str(d.dinner),memo:str(d.memo),reflected:!!d.reflected};}

/* config: 주소는 앱에 내장, 비밀번호만 기기에 저장 */
const CFG={url:DEF_URL,key:(ls("ys_key")||"").trim()};
ls("ys_url",DEF_URL);

let toastT=null;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1800);}
function setStatus(t,state){$("status").textContent=t;$("sDot").className="dot"+(state==="off"?" off":state==="wait"?" wait":"");}

/* routing */
const TABS=["today","inbox","log","stats"];
function curTab(){let t=(location.hash||"").replace("#","");if(t==="archive")t="inbox";return TABS.includes(t)?t:"today";}
function route(){const t=curTab();
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t));
  document.querySelectorAll(".tabbar a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t));
  window.scrollTo(0,0);if(t==="stats")renderStats();if(t==="inbox")markSeen();}
window.addEventListener("hashchange",route);

function renderHeader(){const h=new Date().getHours();
  const g=h<5?"늦은 밤이에요":h<11?"좋은 아침이에요":h<17?"좋은 오후예요":h<21?"좋은 저녁이에요":"오늘도 수고했어요";
  $("greet").textContent=g+",";$("greet").append(document.createElement("br"),"연서 씨");$("dateLine").textContent=korDate(TODAY);$("logDate").textContent=korDate(TODAY);}

/* unread badge */
const seenAt=()=>Number(ls("ys_seen")||0);
function isUnread(b){const t=new Date(b.createdAt).getTime();return !!t&&t>seenAt();}
function renderBadge(){const n=briefs.filter(isUnread).length;const b=$("badge");b.textContent=n>9?"9+":n;b.style.display=n?"flex":"none";}
function markSeen(){const m=briefs.reduce((x,b)=>Math.max(x,new Date(b.createdAt).getTime()||0),0);if(m>seenAt()){ls("ys_seen",String(m));}renderBadge();}

/* detail */
function tile(i,lbl,val,note){const t=el("div","tile c"+(i%6));t.append(el("div","lbl",lbl),el("div","val",val||"—"));if(note)t.append(el("div","note",note));return t;}
function listCard(items,mk){const box=el("div","card");const ul=el("ul","list");items.forEach((p,i)=>{const li=el("li");mk(li,p,i);ul.append(li);});box.append(ul);return box;}
function renderDetail(b){
  const c=el("div");
  c.append(el("div","sub",(str(b.icon)||KIND_ICON[b.kind]||"💬")+" "+(str(b.kind)||"알림")+" · "+korDate(str(b.date)||TODAY)+(b.createdAt?" · "+hhmm(b.createdAt):"")));
  c.append(el("div","bh",str(b.headline)||"알림"));
  if(b.sub)c.append(el("div","sub",str(b.sub)));
  arr(b.alerts).forEach(a=>c.append(el("div","alert",str(a))));
  const tiles=arr(b.tiles);
  if(tiles.length){const g=el("div","grid2");g.style.marginTop="16px";tiles.forEach((t,i)=>g.append(tile(i,str(t.label),str(t.value),str(t.note))));c.append(g);}
  const sched=arr(b.schedule);
  if(sched.length){c.append(el("div","lbl2","일정"));const box=el("div","card tl");sched.forEach(s=>{const it=el("div","it");it.append(el("div","t",str(s.time)),el("div","b",str(s.text)));box.append(it);});c.append(box);}
  const pri=arr(b.priorities);
  if(pri.length){c.append(el("div","lbl2","오늘 우선순위"));c.append(listCard(pri,(li,p,i)=>li.append(el("span","num",i+1),el("span",null,str(p)))));}
  const tasks=arr(b.tasks);
  if(tasks.length){c.append(el("div","lbl2","업무"));c.append(listCard(tasks,(li,p)=>li.append(el("span","box"),el("span",null,str(p)))));}
  const items=arr(b.items);
  if(items.length){const lc=listCard(items,(li,p)=>li.append(el("span",null,str(p))));lc.style.marginTop="16px";c.append(lc);}
  const mk=arr(b.markets);
  if(mk.length){c.append(el("div","lbl2","오늘의 지표"));const g=el("div","grid2");mk.forEach((m,i)=>g.append(tile(i+3,str(m.label),str(m.value),str(m.note))));c.append(g);}
  const qs=arr(b.questions);
  if(qs.length){const q=el("div","q");q.style.marginTop="16px";q.append(el("b",null,"❓ 답해 주세요"));qs.forEach(x=>q.append(el("div",null,str(x))));
    const hint=el("div","src","Claude 대화에 답하거나 기록 탭에서 눌러 주세요");hint.style.marginTop="8px";q.append(hint);c.append(q);}
  const news=arr(b.news);
  if(news.length){c.append(el("div","lbl2","뉴스"));const box=el("div","card news");news.forEach(n=>{const r=el("div");r.append(el("span","tag",str(n.tag)),document.createTextNode(str(n.text)+" "));if(n.source)r.append(el("span","src",str(n.source)));box.append(r);});c.append(box);}
  arr(b.sections).forEach(s=>{c.append(el("div","lbl2",str(s.title)));c.append(listCard(arr(s.items),(li,p)=>li.append(el("span",null,str(p)))));});
  if(b.quote)c.append(el("p","quote","“"+str(b.quote)+"”"));
  if(b.footnote){const f=el("div","src",str(b.footnote));f.style.margin="18px 4px 0";c.append(f);}
  return c;
}
function openSheet(title,node){$("sheetTitle").textContent=title;const bd=$("sheetBody");bd.textContent="";bd.append(node);bd.scrollTop=0;$("scrim").classList.add("on");$("sheet").classList.add("on");}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");}
$("scrim").onclick=closeSheet;$("sheetClose").onclick=closeSheet;
(()=>{let y0=null;const s=$("sheet");
  s.addEventListener("touchstart",e=>{y0=($("sheetBody").scrollTop<=0)?e.touches[0].clientY:null;},{passive:true});
  s.addEventListener("touchmove",e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>0){s.style.transition="none";s.style.transform="translateY("+dy+"px)";}},{passive:true});
  s.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;s.style.transition="";s.style.transform="";if(dy>110)closeSheet();y0=null;});})();
function openBrief(b){openSheet((str(b.icon)||KIND_ICON[b.kind]||"💬")+" "+(str(b.kind)||"알림"),renderDetail(b));}

/* today */
function renderHero(){
  const box=$("hero");box.textContent="";
  const todays=briefs.filter(b=>str(b.date)===TODAY&&BRIEF_KINDS.includes(str(b.kind)));
  const h=new Date().getHours();let pick=null;
  if(todays.length){const eve=todays.find(b=>b.kind==="저녁"),morn=todays.find(b=>b.kind==="아침");pick=(h>=18&&eve)?eve:(morn||todays[0]);}
  const hero=el("div","hero"+(pick?(pick.kind==="저녁"?" eve":(pick.kind==="주간"||pick.kind==="월간")?" week":""):" none"));
  if(!pick){
    hero.append(el("span","k","☀️ 오늘의 브리핑"),el("h2",null,h<7?"아침 7시에 브리핑이 도착해요":"아직 오늘 브리핑이 없어요"),el("p",null,"도착하면 여기에 바로 떠요."));
    const last=briefs.find(b=>BRIEF_KINDS.includes(str(b.kind)));
    if(last){const m=el("div","more");m.append(el("span",null,"가장 최근 · "+shortDate(last.date)+" "+last.kind),el("span","pill","열기"));hero.append(m);hero.onclick=()=>openBrief(last);}
    box.append(hero);return;}
  hero.append(el("span","k",(KIND_ICON[pick.kind]||"☀️")+" "+pick.kind+" 브리핑 · "+hhmm(pick.createdAt)));
  hero.append(el("h2",null,str(pick.headline)||"오늘의 브리핑"));
  if(pick.sub)hero.append(el("p",null,str(pick.sub)));
  const al=arr(pick.alerts);if(al.length){const a=el("div","alerts");al.slice(0,2).forEach(x=>a.append(el("span",null,str(x))));hero.append(a);}
  const info=[];if(arr(pick.schedule).length)info.push("일정 "+arr(pick.schedule).length);if(arr(pick.questions).length)info.push("질문 "+arr(pick.questions).length);if(arr(pick.news).length)info.push("뉴스 "+arr(pick.news).length);
  const m=el("div","more");m.append(el("span",null,info.join(" · ")||"자세히 보기"),el("span","pill","전체 보기 →"));hero.append(m);
  hero.onclick=()=>openBrief(pick);box.append(hero);
}
function ringSvg(val,max,color){const C=2*Math.PI*25,p=Math.max(0,Math.min(val/max,1));
  return '<svg width=60 height=60><circle cx=30 cy=30 r=25 fill=none stroke-width=7 stroke=var(--card2)></circle><circle cx=30 cy=30 r=25 fill=none stroke-width=7 stroke-linecap=round stroke='+color+' stroke-dasharray='+(C*p).toFixed(1)+','+C.toFixed(1)+'></circle></svg>';}
function renderRings(){
  const g=$("rings");g.textContent="";
  const mk=(val,max,color,n,l,s)=>{const d=el("div","ring");const w=el("div","rw");w.innerHTML=ringSvg(val,max,color);w.append(el("div","n",n));d.append(w,el("div","l",l),el("div","s",s));d.onclick=()=>{location.hash="#log";};return d;};
  g.append(
    mk(today.water,8,css("--blue"),today.water,"물",today.water>=8?"달성!":"/ 8잔"),
    mk(today.coffee,2,css("--orange"),today.coffee,"커피",today.coffee>1?"오늘 그만":"잔"),
    mk(today.condition||0,5,css("--purple"),today.condition?COND[today.condition-1][1]:"–","컨디션",today.condition?COND[today.condition-1][2]:"미기록"),
    mk(today.workout.length?1:0,1,css("--green"),today.workout.length?"✓":"–","운동",today.workout.length?today.workout.slice(0,2).join("·"):"아직"));
}
function noticeRow(b){
  const r=el("div","row"+(isUnread(b)?" unread":""));
  r.append(el("div","ic k-"+(str(b.kind)||"기타"),str(b.icon)||KIND_ICON[b.kind]||"💬"));
  const m=el("div","m");const h=el("div","h");h.append(el("span",null,str(b.kind)||"알림"),el("span",null,(str(b.date)!==TODAY?shortDate(b.date)+" ":"")+hhmm(b.createdAt)));
  m.append(h,el("div","tt",str(b.headline)||"알림"));
  const sub=str(b.sub)||str(arr(b.items)[0])||str(arr(b.questions)[0]);if(sub)m.append(el("div","ss",sub));
  r.append(m);r.onclick=()=>openBrief(b);return r;
}
function renderTodayNotices(){
  const box=$("todayNotices");box.textContent="";
  const list=briefs.filter(b=>str(b.date)===TODAY&&!BRIEF_KINDS.includes(str(b.kind))).slice(0,3);
  if(!list.length)return;
  const s=el("div","sec");s.append(el("h3",null,"새 알림"));const a=el("a",null,"모두 보기");a.href="#inbox";s.append(a);box.append(s);
  const rows=el("div","rows");list.forEach(b=>rows.append(noticeRow(b)));box.append(rows);
}
function renderTodaySchedule(){
  const box=$("todaySchedule");box.textContent="";
  const b=briefs.find(x=>str(x.date)===TODAY&&arr(x.schedule).length);if(!b)return;
  const s=el("div","sec");s.append(el("h3",null,"오늘 일정"));box.append(s);
  const c=el("div","card tl");arr(b.schedule).forEach(x=>{const it=el("div","it");it.append(el("div","t",str(x.time)),el("div","b",str(x.text)));c.append(it);});box.append(c);
}

/* inbox */
function renderFilters(){const f=$("filters");f.textContent="";
  ["전체","브리핑","알림","질문"].forEach(k=>{const b=el("button","chip"+(filter===k?" on":""),k);b.onclick=()=>{filter=k;renderFilters();renderInbox();};f.append(b);});}
function renderInbox(){
  const box=$("inbox");box.textContent="";
  let list=briefs.slice();
  if(filter==="브리핑")list=list.filter(b=>BRIEF_KINDS.includes(b.kind));
  if(filter==="알림")list=list.filter(b=>!BRIEF_KINDS.includes(b.kind)&&b.kind!=="질문");
  if(filter==="질문")list=list.filter(b=>b.kind==="질문"||arr(b.questions).length);
  if(!list.length){const e=el("div","card empty");e.style.marginTop="16px";e.append(el("b",null,"아직 받은 알림이 없어요"),document.createTextNode("브리핑과 알림이 오면 여기에 쌓여요."));box.append(e);return;}
  const yest=ymd(new Date(Date.now()-864e5));let cur=null,rows=null;
  list.forEach(b=>{const d=str(b.date);if(d!==cur){cur=d;box.append(el("div","group",d===TODAY?"오늘":d===yest?"어제":korDate(d)));rows=el("div","rows");box.append(rows);}rows.append(noticeRow(b));});
}

/* stats */
function lastNDays(n){const out=[];const base=parseYmd(TODAY);for(let i=n-1;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);out.push(ymd(d));}return out;}
function dayData(id){return id===TODAY?today:(days[id]?normDay(id,days[id]):null);}
function weekStats(){let w=[],c=[],k=[],work=0;lastNDays(7).forEach(id=>{const d=dayData(id);if(!d)return;if(d.water>0)w.push(d.water);if(d.coffee>0)c.push(d.coffee);if(d.condition)k.push(d.condition);if(d.workout.length)work++;});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;return{water:avg(w),coffee:avg(c),cond:avg(k),work};}
const fmt=n=>n==null?"—":(Math.round(n*10)/10).toString();
function renderWeekTiles(target){const s=weekStats();const g=$(target);g.textContent="";
  g.append(tile(1,"평균 컨디션",s.cond==null?"—":fmt(s.cond)+" / 5","기록한 날 기준"),tile(3,"하루 평균 물",s.water==null?"—":fmt(s.water)+"잔","목표 8잔"),
    tile(5,"하루 평균 커피",s.coffee==null?"—":fmt(s.coffee)+"잔","목표 1잔"),tile(4,"운동한 날",s.work+"일","7일 중"));}
const charts={};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mkChart(id,cfg){if(!window.Chart)return;if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg);}
function renderStats(){
  renderWeekTiles("weekTiles");
  const ids=lastNDays(14),labels=ids.map(id=>{const d=parseYmd(id);return(d.getMonth()+1)+"/"+d.getDate();});
  const line=css("--line");
  if(window.Chart){Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=css("--sub");}
  mkChart("chLine",{type:"line",data:{labels,datasets:[{data:ids.map(id=>{const d=dayData(id);return d&&d.condition?d.condition:null;}),borderColor:css("--purple"),backgroundColor:"rgba(122,90,245,.12)",fill:true,tension:.4,spanGaps:true,pointRadius:4,pointBackgroundColor:css("--purple")}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:5,ticks:{stepSize:1},grid:{color:line}},x:{grid:{display:false}}}}});
  mkChart("chBar",{type:"bar",data:{labels,datasets:[{label:"물",data:ids.map(id=>{const d=dayData(id);return d?d.water:0;}),backgroundColor:css("--blue"),borderRadius:6},{label:"커피",data:ids.map(id=>{const d=dayData(id);return d?d.coffee:0;}),backgroundColor:css("--orange"),borderRadius:6}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:8,usePointStyle:true}}},scales:{y:{beginAtZero:true,ticks:{stepSize:2},grid:{color:line}},x:{grid:{display:false}}}}});
  const all=Object.keys(days).concat([TODAY]).filter((v,i,a)=>a.indexOf(v)===i);
  const counts=[0,0,0,0,0];all.forEach(id=>{const d=dayData(id);if(d&&d.condition)counts[d.condition-1]++;});
  mkChart("chCond",{type:"doughnut",data:{labels:COND.map(c=>c[2]),datasets:[{data:counts,backgroundColor:["#ef4444","#f2803a","#e0b100","#22a35a","#2f7cf6"],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"70%",plugins:{legend:{position:"bottom",labels:{boxWidth:8,usePointStyle:true,font:{size:11}}}}}});
  const wc={};WORK.forEach(w=>wc[w]=0);all.forEach(id=>{const d=dayData(id);if(d)d.workout.forEach(w=>wc[w]++);});const wl=WORK.filter(w=>wc[w]>0);
  mkChart("chWork",{type:"doughnut",data:{labels:wl.length?wl:["기록 없음"],datasets:[{data:wl.length?wl.map(w=>wc[w]):[1],backgroundColor:wl.length?["#2f7cf6","#7a5af5","#e5487e","#ef4444","#f2803a","#22a35a","#e0b100"].slice(0,wl.length):[css("--card2")],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:"70%",plugins:{legend:{position:"bottom",labels:{boxWidth:8,usePointStyle:true,font:{size:11}}}}}});
  const list=$("dayList");list.textContent="";
  all.sort().reverse().slice(0,30).forEach(id=>{const d=dayData(id);if(!d)return;const row=el("div","day");row.append(el("span","d",shortDate(id)));
    const p=[];if(d.condition)p.push(COND[d.condition-1][1]+" "+d.condition);if(d.water)p.push("💧"+d.water);if(d.coffee)p.push("☕"+d.coffee);if(d.workout.length)p.push("🏃"+d.workout.join("·"));if(d.alcohol)p.push("🍺");if(d.mood)p.push(d.mood);if(d.memo)p.push(d.memo);
    row.append(el("span","dots",p.length?p.join(" · "):"—"));list.append(row);});
}

/* record */
function renderLog(){
  $("wN").textContent=today.water;$("cN").textContent=today.coffee;
  $("waterNote").textContent=today.water>=8?"오늘 목표 달성! 🎉":"목표 8잔 · "+(8-today.water)+"잔 남음";
  $("coffeeNote").textContent=today.coffee>=2?"오늘은 여기까지!":"14시 전 1잔";
  const cups=$("cups");cups.textContent="";for(let i=0;i<Math.max(8,today.water);i++){const c=el("i");if(i<today.water)c.className="on";cups.append(c);}
  const seg=$("condSeg");seg.textContent="";
  COND.forEach(([n,e,l])=>{const b=el("button","btn"+(today.condition===n?" on":""));b.append(document.createTextNode(e),el("small",null,l));b.onclick=()=>{today.condition=today.condition===n?null:n;changed(true);};seg.append(b);});
  const mc=$("moodChips");mc.textContent="";
  MOOD.forEach(m=>{const b=el("button","btn"+(today.mood===m?" on":""),m);b.onclick=()=>{today.mood=today.mood===m?"":m;changed(true);};mc.append(b);});
  const wc=$("workoutChips");wc.textContent="";
  WORK.forEach(w=>{const b=el("button","btn"+(today.workout.includes(w)?" on":""),w);b.onclick=()=>{today.workout=today.workout.includes(w)?today.workout.filter(x=>x!==w):today.workout.concat([w]);changed(true);};wc.append(b);});
  $("tgSupp").classList.toggle("on",today.supplement);$("tgAlc").classList.toggle("on",today.alcohol);
  [["fBreakfast","breakfast"],["fLunch","lunch"],["fDinner","dinner"],["fMemo","memo"]].forEach(([id,k])=>{const f=$(id);if(document.activeElement!==f)f.value=today[k];});
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="water+")today.water=Math.min(today.water+1,20);if(act==="water-")today.water=Math.max(today.water-1,0);
  if(act==="coffee+")today.coffee=Math.min(today.coffee+1,10);if(act==="coffee-")today.coffee=Math.max(today.coffee-1,0);
  changed(true);});
$("tgSupp").onclick=()=>{today.supplement=!today.supplement;changed(true);};
$("tgAlc").onclick=()=>{today.alcohol=!today.alcohol;changed(true);};
[["fBreakfast","breakfast"],["fLunch","lunch"],["fDinner","dinner"],["fMemo","memo"]].forEach(([id,k])=>{$(id).addEventListener("input",ev=>{today[k]=ev.target.value;changed(false);});});

/* api */
async function apiGet(){const r=await fetch(CFG.url+"?key="+encodeURIComponent(CFG.key)+"&t="+Date.now(),{cache:"no-store"});return r.json();}
async function apiPost(body){const r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:CFG.key},body))});return r.json();}

/* save */
let saveTimer=null,saving=false,dirty=false;
function changed(rerender){today.reflected=false;if(rerender){renderLog();renderRings();renderWeekTiles("weekTilesMini");}
  dirty=true;$("savedNote").textContent="저장 중…";clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(!CFG.key){$("savedNote").textContent="연결이 필요해요";openSettings();return;}
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return;}
  saving=true;dirty=false;const body=Object.assign({},today,{workout:today.workout.slice()});
  try{const res=await apiPost({action:"saveDay",day:body});
    if(res&&res.ok){$("savedNote").textContent="✓ 저장됨 · "+hhmm(new Date());days[TODAY]=body;}
    else{$("savedNote").textContent=(res&&res.error==="key")?"비밀번호가 맞지 않아요":"저장하지 못했어요";dirty=true;if(res&&res.error==="key")openSettings();}
  }catch(err){$("savedNote").textContent="연결이 안 돼요 · 곧 다시 저장할게요";dirty=true;setTimeout(()=>{if(dirty)flush();},5000);}
  saving=false;
}

/* load */
let loading=false;
async function load(show){
  if(!CFG.key){setStatus("연결이 필요해요 · 오른쪽 위 연 버튼을 눌러 주세요","off");return;}
  if(loading)return;loading=true;if(show)setStatus("불러오는 중…","wait");$("refreshBtn").classList.add("spin");
  try{const res=await apiGet();
    if(!res||!res.ok){setStatus(res&&res.error==="key"?"비밀번호가 맞지 않아요":"불러오지 못했어요","off");if(res&&res.error==="key")openSettings();}
    else{const next={};(res.days||[]).forEach(d=>{if(d&&d.date)next[d.date]=d;});days=next;
      if(next[TODAY]&&!dirty&&!saving)today=normDay(TODAY,next[TODAY]);
      briefs=(res.briefings||[]).filter(b=>b&&b.date&&b.kind!=="__app__").sort(byTime);
      setStatus("최신 · "+hhmm(new Date())+" 불러옴","ok");
      ls("ys_cache",JSON.stringify({days:res.days,briefings:(res.briefings||[]).filter(b=>b&&b.kind!=="__app__")}));renderAll();}
  }catch(err){setStatus("연결이 안 돼요 · 저장된 내용을 보여 줘요","off");}
  loading=false;$("refreshBtn").classList.remove("spin");
}
function loadCache(){try{const c=JSON.parse(ls("ys_cache")||"null");if(!c)return;(c.days||[]).forEach(d=>{if(d&&d.date)days[d.date]=d;});if(days[TODAY])today=normDay(TODAY,days[TODAY]);
  briefs=(c.briefings||[]).filter(b=>b&&b.date&&b.kind!=="__app__").sort(byTime);}catch(e){}}

/* settings */
function openSettings(){
  const c=el("div");const card=el("div","card");
  const row=(a,b)=>{const r=el("div","setrow");r.append(el("span",null,a),el("span",null,b));return r;};
  card.append(row("연결 상태",CFG.key?$("status").textContent:"연결 안 됨"),row("받은 알림",briefs.length+"개"),row("앱 버전",APP_VER));c.append(card);
  c.append(el("div","lbl2","비밀번호"));
  const k=el("input","field");k.type="text";k.autocomplete="off";k.setAttribute("autocapitalize","off");k.setAttribute("autocorrect","off");k.spellcheck=false;k.placeholder="비밀번호";k.value=CFG.key;c.append(k);
  const msg=el("div","msg");c.append(msg);
  const save=el("button","btn primary","연결하고 불러오기");
  save.onclick=()=>{const v=k.value.trim();if(!v){msg.textContent="비밀번호를 넣어 주세요";return;}CFG.key=v;ls("ys_key",v);closeSheet();load(true);if(dirty)flush();toast("연결했어요");};
  c.append(save);
  const hint=el("div","src","앱 주소는 앱에 들어 있어요. 비밀번호만 넣으면 돼요.");hint.style.margin="12px 4px 0";c.append(hint);
  openSheet("⚙️ 설정",c);
}
$("openSettings").onclick=openSettings;

function renderAll(){renderHeader();renderHero();renderRings();renderTodayNotices();renderTodaySchedule();renderWeekTiles("weekTilesMini");renderLog();renderFilters();renderInbox();renderBadge();
  const t=curTab();if(t==="stats")renderStats();if(t==="inbox")markSeen();}

/* updates & refresh */
async function checkUpdate(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&v!==APP_VER&&!dirty&&!saving){try{if(sessionStorage.getItem("ys_upd")===v)return;sessionStorage.setItem("ys_upd",v);}catch(e){}location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash);}}catch(e){}}
function wake(){const n=ymd(new Date());if(n!==TODAY){TODAY=n;today=days[n]?normDay(n,days[n]):blankDay(n);renderAll();}if(dirty)flush();load(false);checkUpdate();}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});
window.addEventListener("pageshow",e=>{if(e.persisted)wake();});
window.addEventListener("online",wake);
$("refreshBtn").onclick=()=>{load(true);checkUpdate();};
(()=>{const ptr=el("div",null,"↓ 당겨서 새로고침");ptr.id="ptr";document.body.appendChild(ptr);let y0=null,dy=0;
  window.addEventListener("touchstart",e=>{if(window.scrollY<=0&&e.touches.length===1&&!$("sheet").classList.contains("on")){y0=e.touches[0].clientY;dy=0;}else y0=null;},{passive:true});
  window.addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){ptr.style.transform="translateY("+Math.min(dy/2-70,10)+"px)";ptr.textContent=dy>110?"↻ 놓으면 새로고침":"↓ 당겨서 새로고침";}},{passive:true});
  window.addEventListener("touchend",()=>{if(y0!==null&&dy>110){ptr.textContent="불러오는 중…";load(true).then(()=>{ptr.style.transform="translateY(-70px)";});checkUpdate();}else ptr.style.transform="translateY(-70px)";y0=null;dy=0;});})();

window.__chartReady=()=>{if(curTab()==="stats")renderStats();};
loadCache();renderAll();route();
if(!CFG.key){setStatus("연결이 필요해요 · 오른쪽 위 연 버튼을 눌러 주세요","off");openSettings();}else load(true);
checkUpdate();
setInterval(()=>{if(document.visibilityState==="visible"&&!dirty)load(false);},60000);
setInterval(()=>{const n=ymd(new Date());if(n!==TODAY){TODAY=n;today=days[n]?normDay(n,days[n]):blankDay(n);renderAll();}else renderHeader();},60000);
})();
</script>
</body>
