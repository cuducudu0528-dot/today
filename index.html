<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>브리핑</title>
<script>
/* 첫 화면이 그려지기 전에 테마를 정해 번쩍임(FOUC)을 막는다 */
(function(){var p="system";try{p=localStorage.getItem("ys_theme")||"system";}catch(e){}
var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light");})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="브리핑">
<meta name="application-name" content="브리핑">
<meta name="theme-color" content="#F2F3F5" id="themeColor">
<link rel="apple-touch-icon" href="icon-180.png?v=5">
<link rel="icon" href="icon-192.png?v=5">
<link rel="manifest" href="manifest.json?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css?v=2026-11-25-3">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__chartReady&&window.__chartReady()"></script>
</head>
<body>
<div class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-sleep"></section>
  <section class="view" id="v-health"></section>
  <section class="view" id="v-brief"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-me"></section>
  <div class="status"><span class="sd wait" id="sDot"></span><span id="status">불러오는 중…</span></div>
</div>
<button class="fab" id="fab" aria-label="오늘 기록하기"></button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="hd"><b id="sheetTitle"></b><button class="x" id="sheetClose" aria-label="닫기"></button></div>
  <div class="bd" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<script src="app.js?v=2026-11-25-3"></script>
<script src="ai.js?v=2026-11-25-3"></script>
</body>
</html>
