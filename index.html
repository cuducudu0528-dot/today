<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>브리핑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="브리핑">
<meta name="application-name" content="브리핑">
<meta name="theme-color" content="#f4f1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0a10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.json?v=4">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onload="window.__chartReady&&window.__chartReady()"></script>
<style>
:root{
  --bg:#f4f1f8; --card:rgba(255,255,255,.82); --solid:#ffffff; --card2:rgba(120,110,150,.08); --ink:#15131a; --sub:#8b8796; --line:rgba(40,30,70,.08);
  --accent:#ff6b6b; --grad:linear-gradient(135deg,#ffb36b 0%,#ff6b6b 50%,#7c5cff 100%);
  --blue:#3d7bff; --blue-bg:rgba(61,123,255,.12);
  --orange:#ff8a3d; --orange-bg:rgba(255,138,61,.14);
  --green:#1fb26b; --green-bg:rgba(31,178,107,.13);
  --purple:#7c5cff; --purple-bg:rgba(124,92,255,.13);
  --pink:#ff4f8b; --pink-bg:rgba(255,79,139,.12);
  --red:#ff4d4d; --red-bg:rgba(255,77,77,.12);
  --yellow:#c48a00; --yellow-bg:rgba(255,190,40,.18);
  --shadow:0 1px 1px rgba(30,20,60,.03),0 10px 30px -12px rgba(60,30,110,.18);
  --r:26px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0a10; --card:rgba(30,28,38,.78); --solid:#1a1822; --card2:rgba(255,255,255,.07); --ink:#f6f4fb; --sub:#9b97a8; --line:rgba(255,255,255,.08);
    --blue:#7aa6ff; --orange:#ffad73; --green:#5fe0a0; --purple:#a993ff; --pink:#ff8ab4; --red:#ff8080; --yellow:#ffd36b;
    --shadow:0 0 0 1px rgba(255,255,255,.05);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);min-height:100vh;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.02em;font-feature-settings:'tnum';
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(110px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:440px;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 70% at 15% 0%,rgba(255,179,107,.45),transparent 70%),radial-gradient(55% 60% at 90% 5%,rgba(124,92,255,.35),transparent 70%),radial-gradient(50% 60% at 55% 30%,rgba(255,107,107,.18),transparent 70%)}
@media (prefers-color-scheme: dark){body::before{opacity:.55}}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:680px;margin:0 auto;padding:8px 18px 0}
button{font:inherit;color:inherit}
.btn{appearance:none;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1),opacity .15s}
.btn:active{transform:scale(.94)}
.glass{background:var(--card);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--line);box-shadow:var(--shadow)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 2px 0}
.eyebrow{font-size:13px;font-weight:650;color:var(--sub);letter-spacing:-.01em}
.title{font-size:32px;font-weight:800;letter-spacing:-.045em;margin:2px 0 0;line-height:1.15}
.acts{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn svg{width:19px;height:19px}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;background:var(--grad);box-shadow:0 6px 16px -6px rgba(255,107,107,.7)}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub);margin:10px 2px 0;padding:5px 10px 5px 8px;border-radius:999px;background:var(--card2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 3px rgba(31,178,107,.18)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(255,77,77,.18)}.dot.wait{background:#e5a400;box-shadow:0 0 0 3px rgba(229,164,0,.18)}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:30px 4px 12px}
.sec h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.035em}
.sec a,.sec span.more{font-size:14px;font-weight:650;color:var(--sub);text-decoration:none}
.card{border-radius:var(--r);padding:18px}
.sub{color:var(--sub);font-size:14px;line-height:1.5}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 20px;color:#fff;cursor:pointer;isolation:isolate;
  background:linear-gradient(135deg,#ffae63 0%,#ff6b6b 52%,#d64592 100%);box-shadow:0 20px 40px -18px rgba(255,107,107,.75)}
.hero.eve{background:linear-gradient(135deg,#6a7dff 0%,#7c5cff 50%,#3b2a9e 100%);box-shadow:0 20px 40px -18px rgba(124,92,255,.75)}
.hero.week{background:linear-gradient(135deg,#25c48a 0%,#139b9b 100%);box-shadow:0 20px 40px -18px rgba(19,155,155,.6)}
.hero.none{background:linear-gradient(135deg,#a9adc2,#71768c);box-shadow:none}
.hero::before{content:'';position:absolute;z-index:-1;width:260px;height:260px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 65%)}
.hero::after{content:'';position:absolute;z-index:-1;width:220px;height:220px;left:-60px;bottom:-120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero .k{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25);padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px)}
.hero h2{font-size:27px;line-height:1.28;font-weight:800;letter-spacing:-.045em;margin:16px 0 8px;word-break:keep-all}
.hero p{margin:0;font-size:15px;line-height:1.5;opacity:.92;word-break:keep-all}
.hero .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;font-weight:700}
.hero .pill{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#ff5b5b;border-radius:999px;padding:9px 14px;font-weight:800}
.hero.eve .pill{color:#6a4fe0}.hero.week .pill{color:#139b9b}.hero.none .pill{color:#71768c}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.alerts span{font-size:13px;font-weight:700;background:rgba(20,10,40,.22);padding:9px 12px;border-radius:14px;line-height:1.4}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tileB{border-radius:24px;padding:16px;cursor:pointer;position:relative;overflow:hidden;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tileB .lb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub)}
.tileB .lb i{font-style:normal;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.tileB .bn{font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:10px}
.tileB .bn small{font-size:15px;font-weight:700;color:var(--sub);letter-spacing:-.02em;margin-left:3px}
.tileB .ft{font-size:12px;font-weight:600;color:var(--sub);margin-top:8px}
.tileB{min-height:138px}
.water .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(61,123,255,.18),rgba(61,123,255,.32));transition:height .6s cubic-bezier(.2,.8,.2,1);z-index:0}
.water .fill::before{content:'';position:absolute;left:-10%;right:-10%;top:-10px;height:20px;border-radius:50%;background:rgba(61,123,255,.22)}
.water>*{position:relative;z-index:1}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar b{display:block;height:100%;border-radius:3px}

/* lists */
.tl .it{display:flex;gap:12px;padding:10px 0}
.tl .t{width:50px;flex:none;font-size:13px;font-weight:750;color:var(--sub);padding-top:1px;text-align:right}
.tl .b{flex:1;font-size:15px;line-height:1.45;border-left:2px solid var(--line);padding-left:14px;position:relative}
.tl .b::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--grad)}
.group{font-size:13px;font-weight:750;color:var(--sub);margin:24px 8px 8px}
.rows{border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;cursor:pointer;position:relative}
.row+.row::before{content:'';position:absolute;top:0;left:68px;right:16px;height:1px;background:var(--line)}
.row:active{background:var(--card2)}
.ic{width:40px;height:40px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.row .m{flex:1;min-width:0}
.row .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);font-weight:650}
.row .tt{font-size:15.5px;font-weight:750;margin-top:2px;line-height:1.35;word-break:keep-all}
.row .ss{font-size:13.5px;color:var(--sub);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unread .tt::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.k-아침{background:var(--orange-bg)}.k-저녁{background:var(--purple-bg)}.k-주간,.k-월간{background:var(--green-bg)}
.k-마감{background:var(--red-bg)}.k-알림{background:var(--blue-bg)}.k-질문{background:var(--yellow-bg)}.k-일본어{background:var(--pink-bg)}.k-출발{background:var(--blue-bg)}.k-기타{background:var(--card2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
.empty{text-align:center;padding:36px 18px;color:var(--sub);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.tile{border-radius:22px;padding:15px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile .lbl{font-size:12.5px;font-weight:700;opacity:.9}
.tile .val{font-size:23px;font-weight:800;letter-spacing:-.04em;margin:8px 0 2px;line-height:1.15;word-break:keep-all}
.tile .note{font-size:12px;opacity:.85;line-height:1.35}
.c0{background:var(--yellow-bg);color:var(--yellow)}.c1{background:var(--purple-bg);color:var(--purple)}.c2{background:var(--pink-bg);color:var(--pink)}
.c3{background:var(--blue-bg);color:var(--blue)}.c4{background:var(--green-bg);color:var(--green)}.c5{background:var(--orange-bg);color:var(--orange)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,5,20,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93vh;background:var(--bg);border-radius:30px 30px 0 0;z-index:61;visibility:hidden;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.2,1),visibility .38s;display:flex;flex-direction:column;max-width:720px;margin:0 auto;overflow:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--sub);opacity:.35;margin:9px auto 2px;flex:none}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 4px;flex:none}
.sheet .hd b{font-size:16px}
.sheet .x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--sub)}
.sheet .bd{overflow-y:auto;padding:6px 18px calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text}
.bh{font-size:26px;font-weight:800;letter-spacing:-.045em;line-height:1.3;margin:8px 0 8px;word-break:keep-all}
.lbl2{font-size:13px;font-weight:750;color:var(--sub);margin:24px 4px 8px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.list li:first-child{border-top:0;padding-top:2px}.list li:last-child{padding-bottom:2px}
.num{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.box{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);flex:none;margin-top:2px}
.q{background:var(--yellow-bg);border-radius:22px;padding:15px 16px}
.q b{display:block;font-size:13px;margin-bottom:6px;color:var(--yellow)}
.q div{font-size:14.5px;line-height:1.6}
.news div{padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.news div:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--card2);margin-right:6px;color:var(--sub)}
.src{color:var(--sub);font-size:12px;line-height:1.5}
.quote{font-size:15px;line-height:1.6;color:var(--sub);margin:22px 4px 0;text-align:center}
.alert{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--red);background:var(--red-bg);padding:10px 12px;border-radius:14px;line-height:1.45}

/* record */
.counter{display:flex;align-items:center;gap:12px}
.counter .meta{flex:1;min-width:0}
.counter .meta .big{font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1}
.counter .meta .big small{font-size:15px;color:var(--sub);font-weight:700;margin-left:3px}
.counter .meta span{display:block;font-size:13px;color:var(--sub);margin-top:6px}
.counter .meta .nm{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.plus{width:58px;height:58px;border-radius:20px;font-size:28px;font-weight:500;color:#fff}
.minus{width:42px;height:42px;border-radius:15px;font-size:20px;background:var(--card2);color:var(--sub)}
.b-blue{background:linear-gradient(135deg,#6aa1ff,#3d6bff);box-shadow:0 8px 18px -8px rgba(61,107,255,.8)}
.b-orange{background:linear-gradient(135deg,#ffb36b,#ff7a3d);box-shadow:0 8px 18px -8px rgba(255,122,61,.8)}
.cups{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.cups i{width:26px;height:32px;border-radius:5px 5px 10px 10px;background:var(--card2);display:block;transition:background .25s}
.cups i.on{background:linear-gradient(180deg,#a7cbff,#3d7bff)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:12px 0 10px;border-radius:18px;background:var(--card2);color:var(--sub);font-size:24px;line-height:1.2;border:0}
.seg button small{display:block;font-size:11px;font-weight:750;margin-top:4px}
.seg button.on{background:var(--ink);color:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{padding:10px 16px;border-radius:999px;background:var(--card2);color:var(--sub);font-size:14px;font-weight:700;border:0}
.pills button.on{background:var(--ink);color:var(--bg)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.trow+.trow{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.lab{font-size:15px;font-weight:700}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--card2);position:relative;flex:none;border:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s}
.toggle.on{background:#34c759}.toggle.on::after{left:22px}
.field{width:100%;border:0;background:var(--card2);color:var(--ink);border-radius:15px;padding:14px;font:inherit;font-size:16px;outline:none}
.field::placeholder{color:var(--sub)}
.fields{display:grid;gap:8px}
.saved{font-size:12px;color:var(--sub);text-align:right;margin-top:10px;min-height:16px}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{border-radius:16px;background:var(--card2);padding:10px 12px}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.04em}
.kpi span{font-size:11.5px;font-weight:650;color:var(--sub)}
.chartbox{position:relative;height:220px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{margin-left:auto;font-weight:800}
.daylist .day{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.daylist .day:first-child{border-top:0;padding-top:0}
.daylist .d{min-width:74px;font-weight:750}
.dots{color:var(--sub);font-size:13px;line-height:1.5}

/* tabbar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(92%,440px);
  padding:7px;border-radius:30px;display:flex;gap:4px;z-index:40}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--sub);font-size:10.5px;font-weight:750;padding:8px 0 7px;border-radius:24px;position:relative;transition:background .2s,color .2s}
.tabbar a svg{display:block;margin:0 auto 3px;width:23px;height:23px}
.tabbar a.on{color:#fff;background:var(--grad);box-shadow:0 8px 18px -8px rgba(255,107,107,.9)}
.badge{position:absolute;top:3px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;border:2px solid var(--solid)}
.view{display:none}.view.on{display:block;animation:fade .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#ptr{position:fixed;left:0;right:0;top:0;text-align:center;font-size:12px;font-weight:650;color:var(--sub);padding-top:calc(env(safe-area-inset-top) + 8px);transform:translateY(-70px);transition:transform .2s;z-index:30;pointer-events:none}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:750;z-index:80;transition:transform .3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:15px}
.setrow:first-child{border-top:0;padding-top:0}.setrow:last-child{padding-bottom:0}
.setrow span:last-child{color:var(--sub);font-size:14px;text-align:right}
.primary{width:100%;padding:16px;border-radius:18px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;border:0;margin-top:12px}
.msg{font-size:13px;color:var(--red);margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">

  <section class="view" id="v-today">
    <div class="top">
      <div><div class="eyebrow" id="dateLine"></div><div class="title" id="greet">안녕하세요</div></div>
      <div class="acts">

<script>
(function(){
"use strict";
const APP_VER="2026-11-19-4";
const DEF_URL="https://script.google.com/macros/s/AKfycbxgoPMdod-SPlKH4gcsmEH5bg1GVYMmRDgropKc4qbqLEBAKAQlR95xIzrz75Zfh2o9dg/exec";
const WEEK=["일","월","화","수","목","금","토"];
const COND=[[1,"😫","지침"],[2,"😮‍💨","피곤"],[3,"🙂","보통"],[4,"😊","좋음"],[5,"🤩","최고"]];
const COND_COL=["#ff4d4d","#ff8a3d","#f2b705","#1fb26b","#3d7bff"];
const WORK=["등","팔","어깨","가슴","하체","유산소","스트레칭"];
const WORK_COL=["#3d7bff","#7c5cff","#ff4f8b","#ff4d4d","#ff8a3d","#1fb26b","#f2b705"];
const MOOD=["평온","좋음","피곤","스트레스","우울","예민"];
const KIND_ICON={"아침":"☀️","저녁":"🌙","주간":"🗓️","월간":"📆","마감":"⏰","알림":"🔔","질문":"📝","일본어":"🇯🇵","출발":"🚶","기타":"💬"};
const BRIEF_KINDS=["아침","저녁","주간","월간","마감"];

const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function parseYmd(s){const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);}
function korDate(s){const d=parseYmd(s);return(d.getMonth()+1)+"월 "+d.getDate()+"일 "+WEEK[d.getDay()]+"요일";}
function shortDate(s){const d=parseYmd(s);return(d.getMonth()+1)+"/"+d.getDate()+" ("+WEEK[d.getDay()]+")";}
const str=v=>typeof v==="string"?v:(v==null?"":String(v));
const arr=v=>Array.isArray(v)?v:[];
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null;};
function hhmm(x){const t=x instanceof Date?x:new Date(x);return isNaN(t)?"":pad(t.getHours())+":"+pad(t.getMinutes());}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
const byTime=(a,b)=>(str(b.createdAt)).localeCompare(str(a.createdAt));
const fmt=n=>n==null?"—":(Math.round(n*10)/10).toString();

let TODAY=ymd(new Date());
let days={},briefs=[],filter="전체";
let today=blankDay(TODAY);
function blankDay(id){return{date:id,water:0,coffee:0,workout:[],condition:null,mood:"",supplement:false,alcohol:false,breakfast:"",lunch:"",dinner:"",memo:"",reflected:false};}
function normDay(id,d){d=d||{};return{date:id,water:num(d.water)||0,coffee:num(d.coffee)||0,workout:arr(d.workout).map(str).filter(w=>WORK.includes(w)),
  condition:num(d.condition),mood:str(d.mood),supplement:!!d.supplement,alcohol:!!d.alcohol,breakfast:str(d.breakfast),lunch:str(d.lunch),dinner:str(d.dinner),memo:str(d.memo),reflected:!!d.reflected};}

const CFG={url:DEF_URL,key:(ls("ys_key")||"").trim()};
ls("ys_url",DEF_URL);

let toastT=null;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),1800);}
function setStatus(t,state){$("status").textContent=t;$("sDot").className="dot"+(state==="off"?" off":state==="wait"?" wait":"");}

/* routing */
const TABS=["today","inbox","log","stats"];
function curTab(){let t=(location.hash||"").replace("#","");if(t==="archive")t="inbox";return TABS.includes(t)?t:"today";}
function route(){const t=curTab();
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+t));
  document.querySelectorAll(".tabbar a").forEach(a=>a.classList.toggle("on",a.dataset.tab===t));
  window.scrollTo(0,0);if(t==="stats")renderStats();if(t==="inbox")markSeen();}
window.addEventListener("hashchange",route);

function renderHeader(){const h=new Date().getHours();
  $("greet").textContent=h<5?"늦은 밤이에요":h<11?"좋은 아침이에요":h<17?"좋은 오후예요":h<21?"좋은 저녁이에요":"오늘도 수고했어요";
  $("dateLine").textContent=korDate(TODAY);$("logDate").textContent=korDate(TODAY);}

/* unread */
const seenAt=()=>Number(ls("ys_seen")||0);
function isUnread(b){const t=new Date(b.createdAt).getTime();return !!t&&t>seenAt();}
function renderBadge(){const n=briefs.filter(isUnread).length;const b=$("badge");b.textContent=n>9?"9+":n;b.style.display=n?"flex":"none";}
function markSeen(){const m=briefs.reduce((x,b)=>Math.max(x,new Date(b.createdAt).getTime()||0),0);if(m>seenAt())ls("ys_seen",String(m));renderBadge();}

/* detail sheet */
function tile(i,lbl,val,note){const t=el("div","tile c"+(i%6));t.append(el("div","lbl",lbl),el("div","val",val||"—"));if(note)t.append(el("div","note",note));return t;}
function listCard(items,mk){const box=el("div","card glass");const ul=el("ul","list");items.forEach((p,i)=>{const li=el("li");mk(li,p,i);ul.append(li);});box.append(ul);return box;}
function renderDetail(b){
  const c=el("div");
  c.append(el("div","sub",(str(b.icon)||KIND_ICON[b.kind]||"💬")+" "+(str(b.kind)||"알림")+" · "+korDate(str(b.date)||TODAY)+(b.createdAt?" · "+hhmm(b.createdAt):"")));
  c.append(el("div","bh",str(b.headline)||"알림"));
  if(b.sub)c.append(el("div","sub",str(b.sub)));
  arr(b.alerts).forEach(a=>c.append(el("div","alert",str(a))));
  const tiles=arr(b.tiles);
  if(tiles.length){const g=el("div","grid2");g.style.marginTop="16px";tiles.forEach((t,i)=>g.append(tile(i,str(t.label),str(t.value),str(t.note))));c.append(g);}
  const sched=arr(b.schedule);
  if(sched.length){c.append(el("div","lbl2","일정"));const box=el("div","card glass tl");sched.forEach(s=>{const it=el("div","it");it.append(el("div","t",str(s.time)),el("div","b",str(s.text)));box.append(it);});c.append(box);}
  const pri=arr(b.priorities);
  if(pri.length){c.append(el("div","lbl2","오늘 우선순위"));c.append(listCard(pri,(li,p,i)=>li.append(el("span","num",i+1),el("span",null,str(p)))));}
  const tasks=arr(b.tasks);
  if(tasks.length){c.append(el("div","lbl2","업무"));c.append(listCard(tasks,(li,p)=>li.append(el("span","box"),el("span",null,str(p)))));}
  const items=arr(b.items);
  if(items.length){const lc=listCard(items,(li,p)=>li.append(el("span",null,str(p))));lc.style.marginTop="16px";c.append(lc);}
  const mk=arr(b.markets);
  if(mk.length){c.append(el("div","lbl2","오늘의 지표"));const g=el("div","grid2");mk.forEach((m,i)=>g.append(tile(i+3,str(m.label),str(m.value),str(m.note))));c.append(g);}
  const qs=arr(b.questions);
  if(qs.length){const q=el("div","q");q.style.marginTop="16px";q.append(el("b",null,"❓ 답해 주세요"));qs.forEach(x=>q.append(el("div",null,str(x))));
    const hint=el("div","src","Claude 대화에 답하거나 기록 탭에서 눌러 주세요");hint.style.marginTop="8px";q.append(hint);c.append(q);}
  const news=arr(b.news);
  if(news.length){c.append(el("div","lbl2","뉴스"));const box=el("div","card glass news");news.forEach(n=>{const r=el("div");r.append(el("span","tag",str(n.tag)),document.createTextNode(str(n.text)+" "));if(n.source)r.append(el("span","src",str(n.source)));box.append(r);});c.append(box);}
  arr(b.sections).forEach(s=>{c.append(el("div","lbl2",str(s.title)));c.append(listCard(arr(s.items),(li,p)=>li.append(el("span",null,str(p)))));});
  if(b.quote)c.append(el("p","quote","“"+str(b.quote)+"”"));
  if(b.footnote){const f=el("div","src",str(b.footnote));f.style.margin="18px 4px 0";c.append(f);}
  return c;
}
function openSheet(title,node){$("sheetTitle").textContent=title;const bd=$("sheetBody");bd.textContent="";bd.append(node);bd.scrollTop=0;$("scrim").classList.add("on");$("sheet").classList.add("on");}
function closeSheet(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");}
$("scrim").onclick=closeSheet;$("sheetClose").onclick=closeSheet;
(()=>{let y0=null;const s=$("sheet");
  s.addEventListener("touchstart",e=>{y0=($("sheetBody").scrollTop<=0)?e.touches[0].clientY:null;},{passive:true});
  s.addEventListener("touchmove",e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>0){s.style.transition="none";s.style.transform="translateY("+dy+"px)";}},{passive:true});
  s.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;s.style.transition="";s.style.transform="";if(dy>110)closeSheet();y0=null;});})();
function openBrief(b){openSheet((str(b.icon)||KIND_ICON[b.kind]||"💬")+" "+(str(b.kind)||"알림"),renderDetail(b));}

/* today */
function renderHero(){
  const box=$("hero");box.textContent="";
  const todays=briefs.filter(b=>str(b.date)===TODAY&&BRIEF_KINDS.includes(str(b.kind)));
  const h=new Date().getHours();let pick=null;
  if(todays.length){const eve=todays.find(b=>b.kind==="저녁"),morn=todays.find(b=>b.kind==="아침");pick=(h>=18&&eve)?eve:(morn||todays[0]);}
  const hero=el("div","hero"+(pick?(pick.kind==="저녁"?" eve":(pick.kind==="주간"||pick.kind==="월간")?" week":""):" none"));
  if(!pick){
    hero.append(el("span","k","☀️ 오늘의 브리핑"),el("h2",null,h<7?"아침 7시에 브리핑이 도착해요":"아직 오늘 브리핑이 없어요"),el("p",null,"도착하면 여기에 바로 떠요."));
    const last=briefs.find(b=>BRIEF_KINDS.includes(str(b.kind)));
    if(last){const m=el("div","foot");m.append(el("span",null,"가장 최근 · "+shortDate(last.date)+" "+last.kind),el("span","pill","열기 →"));hero.append(m);hero.onclick=()=>openBrief(last);}
    box.append(hero);return;}
  hero.append(el("span","k",(KIND_ICON[pick.kind]||"☀️")+" "+pick.kind+" 브리핑 · "+hhmm(pick.createdAt)));
  hero.append(el("h2",null,str(pick.headline)||"오늘의 브리핑"));
  if(pick.sub)hero.append(el("p",null,str(pick.sub)));
  const al=arr(pick.alerts);if(al.length){const a=el("div","alerts");al.slice(0,2).forEach(x=>a.append(el("span",null,str(x))));hero.append(a);}
  const info=[];if(arr(pick.schedule).length)info.push("일정 "+arr(pick.schedule).length);if(arr(pick.questions).length)info.push("질문 "+arr(pick.questions).length);if(arr(pick.news).length)info.push("뉴스 "+arr(pick.news).length);
  const m=el("div","foot");m.append(el("span",null,info.join(" · ")||"자세히 보기"),el("span","pill","전체 보기 →"));hero.append(m);
  hero.onclick=()=>openBrief(pick);box.append(hero);
}
function renderBento(){
  const g=$("bento");g.textContent="";
  const go=()=>{location.hash="#log";};
  const mk=(cls,icon,iconBg,label,big,unit,foot)=>{const t=el("div","tileB glass "+cls);const lb=el("div","lb");const i=el("i",null,icon);i.style.background=iconBg;lb.append(i,document.createTextNode(label));
    const bn=el("div","bn",big);if(unit)bn.append(el("small",null,unit));t.append(lb,bn);if(foot)t.append(foot);t.onclick=go;return t;};
  const w=mk("water","💧","var(--blue-bg)","물",today.water,"/ 8잔",el("div","ft",today.water>=8?"오늘 목표 달성! 🎉":(8-today.water)+"잔 더 마시면 목표예요"));
  const fill=el("div","fill");fill.style.height=Math.min(100,today.water/8*100)+"%";w.prepend(fill);
  const cb=el("div","bar");const cbi=el("b");cbi.style.width=Math.min(100,today.coffee/2*100)+"%";cbi.style.background=today.coffee>1?"var(--red)":"var(--orange)";cb.append(cbi);
  const c=mk("","☕","var(--orange-bg)","커피",today.coffee,"잔",cb);
  const cd=today.condition;
  const k=mk("","🫶","var(--purple-bg)","컨디션",cd?COND[cd-1][1]:"–",cd?COND[cd-1][2]:"",el("div","ft",cd?cd+" / 5":"아직 기록 안 했어요"));
  const wo=mk("","🏃","var(--green-bg)","운동",today.workout.length?"✓":"–","",el("div","ft",today.workout.length?today.workout.join("·"):"쉬는 날도 괜찮아요"));
  g.append(w,c,k,wo);
}
function noticeRow(b){
  const r=el("div","row"+(isUnread(b)?" unread":""));
  r.append(el("div","ic k-"+(str(b.kind)||"기타"),str(b.icon)||KIND_ICON[b.kind]||"💬"));
  const m=el("div","m");const h=el("div","h");h.append(el("span",null,str(b.kind)||"알림"),el("span",null,(str(b.date)!==TODAY?shortDate(b.date)+" ":"")+hhmm(b.createdAt)));
  m.append(h,el("div","tt",str(b.headline)||"알림"));
  const sub=str(b.sub)||str(arr(b.items)[0])||str(arr(b.questions)[0]);if(sub)m.append(el("div","ss",sub));
  r.append(m);r.onclick=()=>openBrief(b);return r;
}
function renderTodayNotices(){
  const box=$("todayNotices");box.textContent="";
  const list=briefs.filter(b=>str(b.date)===TODAY&&!BRIEF_KINDS.includes(str(b.kind))).slice(0,3);
  if(!list.length)return;
  const s=el("div","sec");s.append(el("h3",null,"새 알림"));const a=el("a",null,"모두 보기 ›");a.href="#inbox";s.append(a);box.append(s);
  const rows=el("div","rows glass");list.forEach(b=>rows.append(noticeRow(b)));box.append(rows);
}
function renderTodaySchedule(){
  const box=$("todaySchedule");box.textContent="";
  const b=briefs.find(x=>str(x.date)===TODAY&&arr(x.schedule).length);if(!b)return;
  const s=el("div","sec");s.append(el("h3",null,"오늘 일정"));box.append(s);
  const c=el("div","card glass tl");arr(b.schedule).forEach(x=>{const it=el("div","it");it.append(el("div","t",str(x.time)),el("div","b",str(x.text)));c.append(it);});box.append(c);
}

/* inbox */
function renderFilters(){const f=$("filters");f.textContent="";
  ["전체","브리핑","알림","질문"].forEach(k=>{const b=el("button","chip glass"+(filter===k?" on":""),k);b.onclick=()=>{filter=k;renderFilters();renderInbox();};f.append(b);});}
function renderInbox(){
  const box=$("inbox");box.textContent="";
  let list=briefs.slice();
  if(filter==="브리핑")list=list.filter(b=>BRIEF_KINDS.includes(b.kind));
  if(filter==="알림")list=list.filter(b=>!BRIEF_KINDS.includes(b.kind)&&b.kind!=="질문");
  if(filter==="질문")list=list.filter(b=>b.kind==="질문"||arr(b.questions).length);
  if(!list.length){const e=el("div","card glass empty");e.style.marginTop="16px";e.append(el("b",null,"아직 받은 알림이 없어요"),document.createTextNode("브리핑과 알림이 오면 여기에 쌓여요."));box.append(e);return;}
  const yest=ymd(new Date(Date.now()-864e5));let cur=null,rows=null;
  list.forEach(b=>{const d=str(b.date);if(d!==cur){cur=d;box.append(el("div","group",d===TODAY?"오늘":d===yest?"어제":korDate(d)));rows=el("div","rows glass");box.append(rows);}rows.append(noticeRow(b));});
}

/* stats */
function lastNDays(n){const out=[];const base=parseYmd(TODAY);for(let i=n-1;i>=0;i--){const d=new Date(base);d.setDate(base.getDate()-i);out.push(ymd(d));}return out;}
function dayData(id){return id===TODAY?today:(days[id]?normDay(id,days[id]):null);}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function weekStats(){let w=[],c=[],k=[],work=0;lastNDays(7).forEach(id=>{const d=dayData(id);if(!d)return;if(d.water>0)w.push(d.water);if(d.coffee>0)c.push(d.coffee);if(d.condition)k.push(d.condition);if(d.workout.length)work++;});
  return{water:avg(w),coffee:avg(c),cond:avg(k),work};}
function renderWeekTiles(target){const s=weekStats();const g=$(target);g.textContent="";
  g.append(tile(1,"평균 컨디션",s.cond==null?"—":fmt(s.cond)+" / 5","기록한 날 기준"),tile(3,"하루 평균 물",s.water==null?"—":fmt(s.water)+"잔","목표 8잔"),
    tile(5,"하루 평균 커피",s.coffee==null?"—":fmt(s.coffee)+"잔","목표 1잔"),tile(4,"운동한 날",s.work+"일","7일 중"));}
function kpis(id,items){const b=$(id);b.textContent="";items.forEach(([v,l])=>{const k=el("div","kpi");k.append(el("b",null,v),el("span",null,l));b.append(k);});}
const charts={};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
const valueLabels={id:"vl",afterDatasetsDraw(c){const x=c.ctx;x.save();x.font="700 11px "+getComputedStyle(document.body).fontFamily;x.textAlign="center";x.fillStyle=css("--ink");
  c.data.datasets.forEach((ds,i)=>{const meta=c.getDatasetMeta(i);if(meta.hidden)return;meta.data.forEach((p,j)=>{const v=ds.data[j];if(v==null||v===0)return;x.fillText(String(v),p.x,p.y-8);});});x.restore();}};
const centerText={id:"ct",afterDraw(c){const t=c.options.plugins.ct;if(!t)return;const x=c.ctx,a=c.chartArea;x.save();x.textAlign="center";x.fillStyle=css("--ink");
  x.font="800 26px "+getComputedStyle(document.body).fontFamily;x.fillText(t.big,(a.left+a.right)/2,(a.top+a.bottom)/2+4);
  x.fillStyle=css("--sub");x.font="700 12px "+getComputedStyle(document.body).fontFamily;x.fillText(t.small,(a.left+a.right)/2,(a.top+a.bottom)/2+24);x.restore();}};
function mkChart(id,cfg){if(!window.Chart)return;if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg);}
function legend(id,labels,vals,cols,unit){const b=$(id);b.textContent="";labels.forEach((l,i)=>{const d=el("div");const sw=el("i");sw.style.background=cols[i];d.append(sw,document.createTextNode(l),el("span",null,vals[i]+unit));b.append(d);});}
function renderStats(){
  renderWeekTiles("weekTiles");
  const ids=lastNDays(14),labels=ids.map(id=>{const d=parseYmd(id);return(d.getMonth()+1)+"/"+d.getDate();});
  const cond=ids.map(id=>{const d=dayData(id);return d&&d.condition?d.condition:null;});
  const cv=cond.filter(v=>v!=null);
  kpis("kCond",[[fmt(avg(cv)),"평균"],[cv.length?Math.max(...cv):"—","최고"],[cv.length+"일","기록"]]);
  const water=ids.map(id=>{const d=dayData(id);return d?d.water:0;}),coffee=ids.map(id=>{const d=dayData(id);return d?d.coffee:0;});
  kpis("kDrink",[[fmt(avg(water.filter(v=>v>0)))+"잔","물 평균"],[fmt(avg(coffee.filter(v=>v>0)))+"잔","커피 평균"],[water.reduce((a,b)=>a+b,0)+"잔","물 합계"]]);
  if(!window.Chart)return;
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.color=css("--sub");Chart.defaults.font.weight="600";Chart.defaults.animation=false;
  const line=css("--line");
  mkChart("chLine",{type:"line",plugins:[valueLabels],data:{labels,datasets:[{data:cond,borderColor:"#7c5cff",borderWidth:3,backgroundColor:"rgba(124,92,255,.14)",fill:true,tension:.4,spanGaps:true,pointRadius:4,pointBackgroundColor:"#fff",pointBorderColor:"#7c5cff",pointBorderWidth:2}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false}},scales:{y:{min:0,max:5,ticks:{stepSize:1},grid:{color:line},border:{display:false}},x:{grid:{display:false},border:{display:false},ticks:{maxRotation:0,autoSkipPadding:8}}}}});
  mkChart("chBar",{type:"bar",plugins:[valueLabels],data:{labels,datasets:[{label:"물",data:water,backgroundColor:"#3d7bff",borderRadius:7,borderSkipped:false},{label:"커피",data:coffee,backgroundColor:"#ff8a3d",borderRadius:7,borderSkipped:false}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{position:"bottom",labels:{boxWidth:8,boxHeight:8,usePointStyle:true}}},scales:{y:{beginAtZero:true,ticks:{stepSize:2},grid:{color:line},border:{display:false}},x:{grid:{display:false},border:{display:false},ticks:{maxRotation:0,autoSkipPadding:8}}}}});
  const all=Object.keys(days).concat([TODAY]).filter((v,i,a)=>a.indexOf(v)===i);
  const counts=[0,0,0,0,0];all.forEach(id=>{const d=dayData(id);if(d&&d.condition)counts[d.condition-1]++;});
  const tot=counts.reduce((a,b)=>a+b,0);
  mkChart("chCond",{type:"doughnut",plugins:[centerText],data:{labels:COND.map(c=>c[2]),datasets:[{data:tot?counts:[1],backgroundColor:tot?COND_COL:[css("--card2")],borderWidth:0,spacing:tot?2:0,borderRadius:6}]},
    options:{maintainAspectRatio:false,cutout:"72%",plugins:{legend:{display:false},tooltip:{enabled:!!tot},ct:{big:tot+"일",small:"기록한 날"}}}});
  legend("lgCond",COND.map(c=>c[1]+" "+c[2]),counts,COND_COL,"일");
  const wc=WORK.map(w=>all.reduce((n,id)=>{const d=dayData(id);return n+(d&&d.workout.includes(w)?1:0);},0));const wt=wc.reduce((a,b)=>a+b,0);
  mkChart("chWork",{type:"doughnut",plugins:[centerText],data:{labels:WORK,datasets:[{data:wt?wc:[1],backgroundColor:wt?WORK_COL:[css("--card2")],borderWidth:0,spacing:wt?2:0,borderRadius:6}]},
    options:{maintainAspectRatio:false,cutout:"72%",plugins:{legend:{display:false},tooltip:{enabled:!!wt},ct:{big:wt+"회",small:"운동 기록"}}}});
  legend("lgWork",WORK,wc,WORK_COL,"회");
  const list=$("dayList");list.textContent="";
  all.sort().reverse().slice(0,30).forEach(id=>{const d=dayData(id);if(!d)return;const row=el("div","day");row.append(el("span","d",shortDate(id)));
    const p=[];if(d.condition)p.push(COND[d.condition-1][1]+" "+d.condition);if(d.water)p.push("💧"+d.water);if(d.coffee)p.push("☕"+d.coffee);if(d.workout.length)p.push("🏃"+d.workout.join("·"));if(d.alcohol)p.push("🍺");if(d.mood)p.push(d.mood);if(d.memo)p.push(d.memo);
    row.append(el("span","dots",p.length?p.join(" · "):"—"));list.append(row);});
}

/* record */
function renderLog(){
  $("wN").textContent=today.water;$("cN").textContent=today.coffee;
  $("waterNote").textContent=today.water>=8?"오늘 목표 달성! 🎉":"목표 8잔 · "+(8-today.water)+"잔 남음";
  $("coffeeNote").textContent=today.coffee>=2?"오늘은 여기까지!":"14시 전 1잔";
  const cups=$("cups");cups.textContent="";for(let i=0;i<Math.max(8,today.water);i++){const c=el("i");if(i<today.water)c.className="on";cups.append(c);}
  const seg=$("condSeg");seg.textContent="";
  COND.forEach(([n,e,l])=>{const b=el("button","btn"+(today.condition===n?" on":""));b.append(document.createTextNode(e),el("small",null,l));b.onclick=()=>{today.condition=today.condition===n?null:n;changed(true);};seg.append(b);});
  const mc=$("moodChips");mc.textContent="";
  MOOD.forEach(m=>{const b=el("button","btn"+(today.mood===m?" on":""),m);b.onclick=()=>{today.mood=today.mood===m?"":m;changed(true);};mc.append(b);});
  const wc=$("workoutChips");wc.textContent="";
  WORK.forEach(w=>{const b=el("button","btn"+(today.workout.includes(w)?" on":""),w);b.onclick=()=>{today.workout=today.workout.includes(w)?today.workout.filter(x=>x!==w):today.workout.concat([w]);changed(true);};wc.append(b);});
  $("tgSupp").classList.toggle("on",today.supplement);$("tgAlc").classList.toggle("on",today.alcohol);
  [["fBreakfast","breakfast"],["fLunch","lunch"],["fDinner","dinner"],["fMemo","memo"]].forEach(([id,k])=>{const f=$(id);if(document.activeElement!==f)f.value=today[k];});
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="water+")today.water=Math.min(today.water+1,20);if(act==="water-")today.water=Math.max(today.water-1,0);
  if(act==="coffee+")today.coffee=Math.min(today.coffee+1,10);if(act==="coffee-")today.coffee=Math.max(today.coffee-1,0);
  changed(true);});
$("tgSupp").onclick=()=>{today.supplement=!today.supplement;changed(true);};
$("tgAlc").onclick=()=>{today.alcohol=!today.alcohol;changed(true);};
[["fBreakfast","breakfast"],["fLunch","lunch"],["fDinner","dinner"],["fMemo","memo"]].forEach(([id,k])=>{$(id).addEventListener("input",ev=>{today[k]=ev.target.value;changed(false);});});

/* api */
async function apiGet(){const r=await fetch(CFG.url+"?key="+encodeURIComponent(CFG.key)+"&t="+Date.now(),{cache:"no-store"});return r.json();}
async function apiPost(body){const r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:CFG.key},body))});return r.json();}

/* save */
let saveTimer=null,saving=false,dirty=false;
function changed(rerender){today.reflected=false;if(rerender){renderLog();renderBento();renderWeekTiles("weekTilesMini");}
  dirty=true;$("savedNote").textContent="저장 중…";clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(!CFG.key){$("savedNote").textContent="연결이 필요해요";openSettings();return;}
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);return;}
  saving=true;dirty=false;const body=Object.assign({},today,{workout:today.workout.slice()});
  try{const res=await apiPost({action:"saveDay",day:body});
    if(res&&res.ok){$("savedNote").textContent="✓ 저장됨 · "+hhmm(new Date());days[TODAY]=body;}
    else{$("savedNote").textContent=(res&&res.error==="key")?"비밀번호가 맞지 않아요":"저장하지 못했어요";dirty=true;if(res&&res.error==="key")openSettings();}
  }catch(err){$("savedNote").textContent="연결이 안 돼요 · 곧 다시 저장할게요";dirty=true;setTimeout(()=>{if(dirty)flush();},5000);}
  saving=false;
}

/* load */
let loading=false;
async function load(show){
  if(!CFG.key){setStatus("연결이 필요해요 · 오른쪽 위 연 버튼을 눌러 주세요","off");return;}
  if(loading)return;loading=true;if(show)setStatus("불러오는 중…","wait");$("refreshBtn").classList.add("spin");
  try{const res=await apiGet();
    if(!res||!res.ok){setStatus(res&&res.error==="key"?"비밀번호가 맞지 않아요":"불러오지 못했어요","off");if(res&&res.error==="key")openSettings();}
    else{const next={};(res.days||[]).forEach(d=>{if(d&&d.date)next[d.date]=d;});days=next;
      if(next[TODAY]&&!dirty&&!saving)today=normDay(TODAY,next[TODAY]);
      briefs=(res.briefings||[]).filter(b=>b&&b.date).sort(byTime);
      setStatus("최신 · "+hhmm(new Date())+" 업데이트","ok");
      ls("ys_cache",JSON.stringify({days:res.days,briefings:res.briefings}));renderAll();}
  }catch(err){setStatus("연결이 안 돼요 · 저장된 내용을 보여 줘요","off");}
  loading=false;$("refreshBtn").classList.remove("spin");
}
function loadCache(){try{const c=JSON.parse(ls("ys_cache")||"null");if(!c)return;(c.days||[]).forEach(d=>{if(d&&d.date)days[d.date]=d;});if(days[TODAY])today=normDay(TODAY,days[TODAY]);
  briefs=(c.briefings||[]).filter(b=>b&&b.date).sort(byTime);}catch(e){}}

/* settings */
function openSettings(){
  const c=el("div");const card=el("div","card glass");
  const row=(a,b)=>{const r=el("div","setrow");r.append(el("span",null,a),el("span",null,b));return r;};
  card.append(row("연결 상태",CFG.key?$("status").textContent:"연결 안 됨"),row("받은 알림",briefs.length+"개"),row("앱 버전",APP_VER));c.append(card);
  c.append(el("div","lbl2","비밀번호"));
  const k=el("input","field");k.type="text";k.autocomplete="off";k.setAttribute("autocapitalize","off");k.setAttribute("autocorrect","off");k.spellcheck=false;k.placeholder="비밀번호";k.value=CFG.key;c.append(k);
  const msg=el("div","msg");c.append(msg);
  const save=el("button","btn primary","연결하고 불러오기");
  save.onclick=()=>{const v=k.value.trim();if(!v){msg.textContent="비밀번호를 넣어 주세요";return;}CFG.key=v;ls("ys_key",v);closeSheet();load(true);if(dirty)flush();toast("연결했어요");};
  c.append(save);
  const hint=el("div","src","앱 주소는 앱에 들어 있어요. 비밀번호만 넣으면 돼요.");hint.style.margin="12px 4px 0";c.append(hint);
  openSheet("⚙️ 설정",c);
}
$("openSettings").onclick=openSettings;

function renderAll(){renderHeader();renderHero();renderBento();renderTodayNotices();renderTodaySchedule();renderWeekTiles("weekTilesMini");renderLog();renderFilters();renderInbox();renderBadge();
  const t=curTab();if(t==="stats")renderStats();if(t==="inbox")markSeen();}

/* updates & refresh */
async function checkUpdate(){try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(v&&v!==APP_VER&&!dirty&&!saving){try{if(sessionStorage.getItem("ys_upd")===v)return;sessionStorage.setItem("ys_upd",v);}catch(e){}location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash);}}catch(e){}}
function wake(){const n=ymd(new Date());if(n!==TODAY){TODAY=n;today=days[n]?normDay(n,days[n]):blankDay(n);renderAll();}if(dirty)flush();load(false);checkUpdate();}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();});
window.addEventListener("pageshow",e=>{if(e.persisted)wake();});
window.addEventListener("online",wake);
$("refreshBtn").onclick=()=>{load(true);checkUpdate();};
(()=>{const ptr=el("div",null,"↓ 당겨서 새로고침");ptr.id="ptr";document.body.appendChild(ptr);let y0=null,dy=0;
  window.addEventListener("touchstart",e=>{if(window.scrollY<=0&&e.touches.length===1&&!$("sheet").classList.contains("on")){y0=e.touches[0].clientY;dy=0;}else y0=null;},{passive:true});
  window.addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){ptr.style.transform="translateY("+Math.min(dy/2-70,10)+"px)";ptr.textContent=dy>110?"↻ 놓으면 새로고침":"↓ 당겨서 새로고침";}},{passive:true});
  window.addEventListener("touchend",()=>{if(y0!==null&&dy>110){ptr.textContent="불러오는 중…";load(true).then(()=>{ptr.style.transform="translateY(-70px)";});checkUpdate();}else ptr.style.transform="translateY(-70px)";y0=null;dy=0;});})();

window.__chartReady=()=>{if(curTab()==="stats")renderStats();};
loadCache();renderAll();route();
if(!CFG.key){setStatus("연결이 필요해요 · 오른쪽 위 연 버튼을 눌러 주세요","off");openSettings();}else load(true);
checkUpdate();
setInterval(()=>{if(document.visibilityState==="visible"&&!dirty)load(false);},60000);
setInterval(()=>{const n=ymd(new Date());if(n!==TODAY){TODAY=n;today=days[n]?normDay(n,days[n]):blankDay(n);renderAll();}else renderHeader();},60000);
})();
</script>
